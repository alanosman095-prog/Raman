<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raman</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: #6366f1;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #818cf8;
      transform: scale(1.05);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      color: #d1d5db;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">Raman</div>

      <nav>
        <a href="#">سەرەکی</a>
        <a href="#about">دەربارە</a>
        <a href="#contact">پەیوەندی</a>
      </nav>
    </header>

    <section class="hero">
      <div>
        <h1>بەخێربێیت بۆ Raman</h1>

        <p>
          ئەمە ماڵپەڕی تایبەتی تۆیە 🚀
        </p>

        <a class="btn" href="#about">
          دەستپێبکە
        </a>
      </div>
    </section>

    <section class="cards" id="about">

      <div class="card">
        <h2>⚡ خێرا</h2>
        <p>ماڵپەڕێکی خێرا و سادە.</p>
      </div>

      <div class="card">
        <h2>🎨 جوان</h2>
        <p>دیزاینێکی مۆدێرن و جوان.</p>
      </div>

      <div class="card">
        <h2>📱 مۆبایل</h2>
        <p>لە مۆبایل و کۆمپیوتەر کار دەکات.</p>
      </div>

    </section>

    <footer id="contact">
      © 2026 Raman
    </footer>

  </div>

</body>
</html>
