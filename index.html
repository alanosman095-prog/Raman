<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگێشتنامەی هاوسەرگیری</title>
    <style>
        body { margin: 0; font-family: tahoma, sans-serif; background-color: #f7ebe8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 90%; margin: 20px; }
        .seal { width: 80px; height: 80px; background: #990000; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto 20px; border: 4px solid #cc0000; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h1 { color: #8a304e; font-size: 24px; margin-bottom: 5px; }
        p { color: #555; font-size: 14px; line-height: 1.6; }
        .schedule { border-top: 1px dashed #ccc; margin-top: 20px; padding-top: 15px; text-align: right; }
        .schedule-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="seal">R & S</div>
        <h1>ڕامان & سارا</h1>
        <p>بەخۆشحاڵییەوە بانگێشتتان دەکەین بۆ ئاهەنگی هاوسەرگیریمان</p>
        <hr style="border:0; border-top: 1px solid #eee;">
        <p><strong>بەروار:</strong> ٢٠٢٦/٠٨/١٥</p>
        <p><strong>شوێن:</strong> هۆڵی ئاهەنگەکان</p>
        
        <div class="schedule">
            <h3 style="text-align: center; color: #8a304e;">خشتەی بەرنامەکان</h3>
            <div class="schedule-item"><span>کۆبوونەوەی میوانان:</span> <span>06:00 PM</span></div>
            <div class="schedule-item"><span>هاتنی بووک و زاوای بەڕێز:</span> <span>07:00 PM</span></div>
            <div class="schedule-item"><span>خواردنی ئێوارە:</span> <span>08:30 PM</span></div>
        </div>
    </div>

</body>
</html>
